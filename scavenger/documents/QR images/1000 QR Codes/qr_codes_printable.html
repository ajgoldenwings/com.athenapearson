<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 QR Codes - Printable</title>
    <style>
        @page {
            size: landscape;
            margin: 0.5in;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 100%;
        }

        .qr-row {
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
            margin-bottom: 4px;
            page-break-inside: avoid;
            break-inside: avoid;
            width: 100%;
        }

        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 9%;
            margin: 0 0.5%;
        }

        .qr-code {
            width: 100%;
            height: auto;
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
        }

        .qr-index {
            font-size: 8px;
            margin-top: 1px;
            color: #333;
            font-weight: bold;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .qr-row {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 2px;
            }

            .qr-item {
                width: 9%;
                margin: 0 0.5%;
            }

            .qr-code {
                max-width: 65px;
                max-height: 65px;
                width: 65px;
                height: 65px;
            }

            .qr-index {
                font-size: 6px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- QR Codes will be generated here -->
    </div>

    <script>
        // Generate 1000 QR codes cycling through 0_image.png to 16_image.png
        const container = document.querySelector('.container');
        const totalCodes = 1000;
        const imageCount = 17; // 0 to 16 inclusive
        const codesPerRow = 10;

        // Generate rows of 10 QR codes each
        for (let rowIndex = 0; rowIndex < Math.ceil(totalCodes / codesPerRow); rowIndex++) {
            // Create a row container
            const row = document.createElement('div');
            row.className = 'qr-row';

            // Add up to 10 QR codes to this row
            for (let colIndex = 0; colIndex < codesPerRow; colIndex++) {
                const currentIndex = rowIndex * codesPerRow + colIndex;

                // Stop if we've reached the total number of codes
                if (currentIndex >= totalCodes) break;

                // Create container for QR code and index
                const qrItem = document.createElement('div');
                qrItem.className = 'qr-item';

                // Create the QR code image
                const img = document.createElement('img');

                // Special case: use upstairs.png for the 301st QR code (index 300)
                if (currentIndex === 300) {
                    img.src = 'upstairs.png';
                    img.alt = 'Upstairs QR Code';
                } else {
                    const imageIndex = currentIndex % imageCount;
                    img.src = `${imageIndex}_image.png`;
                    img.alt = `QR Code ${currentIndex + 1}`;
                }

                img.className = 'qr-code';
                img.onerror = function () {
                    console.warn(`Failed to load image: ${this.src}`);
                    this.style.backgroundColor = '#f0f0f0';
                    this.style.border = '1px solid #ccc';
                };

                // Create the index number
                const indexLabel = document.createElement('div');
                indexLabel.className = 'qr-index';
                indexLabel.textContent = currentIndex;

                // Add both to the item container
                qrItem.appendChild(img);
                qrItem.appendChild(indexLabel);

                // Add item to the row
                row.appendChild(qrItem);
            }

            // Add the complete row to the container
            container.appendChild(row);
        }
    </script>
</body>

</html>
