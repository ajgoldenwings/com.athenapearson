<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/vapor/bootstrap.min.css" rel="stylesheet">
</head>

<body style="padding-top: 4.5rem">
    <nav class="navbar navbar-expand-lg fixed-top bg-primary" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="./index.html">Athena</a>
        </div>
    </nav>

    <div class="container py-0 py-md-4 py-lg-5 text-center">
        <figure class="text-center py-5">
            <blockquote class="blockquote text-warning">
                <p id="clue">I am in a playful spirit! No way am I able to go back to bed. Sing me a song now! Will you sing it Upside-down standing on head or just a headstand? It's a specific song and you must use the big surprise secret and play that song instead. Find this person to sing this too and no it is not the birthday girl. It is not currently their birthday, but they fit in a cookie jar and that's the person U must find!</p>
            </blockquote>
            <figcaption class="figure-caption text-danger">
                <i id="extra"></i>
            </figcaption>
        </figure>

        <figure class="figure" style="max-width: 600px;">
            <img id="image" src="images/scavenger/play.png" alt="image" class="figure-img img-fluid rounded border border-4 border-info">
        </figure>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
